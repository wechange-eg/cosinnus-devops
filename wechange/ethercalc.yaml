version: "3"

volumes:
  ethercalc-redis-data:

services:
  ethercalc:
    image: audreyt/ethercalc:latest
    container_name: ethercalc
    depends_on:
      - ethercalc-redis
    env_file:
      - ../settings/ethercalc.env
    labels:
      traefik.enable: true
      traefik.http.routers.ethercalc-router.rule: Host(`calc.wechange.localhost`)
      traefik.http.routers.ethercalc-router.service: ethercalc
      traefik.http.services.ethercalc.loadbalancer.server.port: 8000

  ethercalc-redis:
    image: redis:latest
    container_name: ethercalc-redis
    restart: always
    logging:
      driver: "none" # disable saving logs
    volumes:
      - ethercalc-redis-data:/data:cached
