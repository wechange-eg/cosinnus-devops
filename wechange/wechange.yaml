version: "3"

volumes:
  wechange-postgres-data:
  wechange-elasticsearch-data:

services:
  wechange-postgres:
    image: postgres:latest
    container_name: wechange-postgres
    restart: always
    volumes:
      - wechange-postgres-data:/var/lib/postgresql/data
    env_file:
      - ../settings/wechange.postgres.env

  wechange-elasticsearch:
    image: elasticsearch:7.17.18
    container_name: wechange-elasticsearch
    volumes:
      - wechange-elasticsearch-data:/usr/share/elasticsearch/data
    env_file:
      - ../settings/wechange.elasticsearch.env

  wechange-memcached:
    image: memcached:latest
    container_name: wechange-memcached

  wechange-backend:
    image: wechange-backend
    container_name: wechange-backend
    env_file:
      - ../settings/wechange.backend.env
    volumes:
      - ../apps/wechange-backend:/opt/wechange/backend:rw
      - ../apps/wechange-backend/.env.docker:/opt/wechange/backend/.env
    links:
      - wechange-postgres
      - wechange-elasticsearch
      - wechange-memcached
    depends_on:
      - wechange-postgres
      - wechange-elasticsearch
      - wechange-memcached
    labels:
      traefik.enable: true
      traefik.http.routers.wechange-backend-router.rule: Host(`wechange.localhost`)
      traefik.http.routers.wechange-backend-router.service: wechange-backend
      traefik.http.services.wechange-backend.loadbalancer.server.port: 8000

  wechange-frontend:
    image: wechange-frontend
    container_name: wechange-frontend
    env_file:
      - ../settings/wechange.frontend.env
    volumes:
      - ../apps/wechange-frontend:/opt/wechange/frontend:rw
      - ../apps/wechange-frontend/.env.docker:/opt/wechange/frontend/.env
    labels:
      traefik.enable: true
      traefik.http.routers.wechange-frontend-router.rule: Host(`wechange.localhost`) && (Query(`v=3`) || PathPrefix(`/_next`) || PathPrefix(`/_next_public`) || PathPrefix(`/__nextjs_original-stack-frame`) || PathPrefix(`/api/frontend`))
      traefik.http.routers.wechange-frontend-router.service: wechange-frontend
      traefik.http.services.wechange-frontend.loadbalancer.server.port: 3000
