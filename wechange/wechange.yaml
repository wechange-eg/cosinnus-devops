version: "3"

services:
  wechange-backend:
    build: .
    command: ["./docker-entrypoint.sh"]
    volumes:
      - .:/code
      - ./devops/settings_docker.py:/code/devops/settings.py
    ports:
      - "8000:8000"
    depends_on:
      - wechange-postgres

  wechange-frontend:
    build: .
    command: ["./docker-entrypoint.sh"]
    volumes:
      - .:/code
      - ./devops/settings_docker.py:/code/devops/settings.py
    ports:
      - "8000:8000"
    depends_on:
      - wechange-backend

  wechange-postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - 3001:5432
    expose: ["5432"]

  wechange-elasticsearch:
    image: elasticsearch:1.3.9
    ports:
      - 3003:9200
    expose: ["9200"]

  wechange-memcached:
    image: memcached:latest
    ports:
      - 3004:11211
    expose: ["11211"]
