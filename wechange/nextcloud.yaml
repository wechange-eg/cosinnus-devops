version: "3"

services:
  nextcloud:
    image: nextcloud
    ports:
      - 3006:80
    volumes:
      - ./nextcloud:/var/www/html
    depends_on:
      - nextcloud-db

  nextcloud-db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: "nextcloud"
      MYSQL_DATABASE: "nextcloud"
      MYSQL_USER: "nextcloud"
      MYSQL_PASSWORD: "nextcloud"
    ports:
      - 3007:3306
    expose: ["3306"]
