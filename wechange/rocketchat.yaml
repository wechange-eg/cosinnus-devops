version: "3"

volumes:
  rocketchat-mongodb-data: { driver: local }

services:
  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    container_name: rocketchat
    restart: always
    env_file:
      - ../settings/rocketchat.env
    depends_on:
      - rocketchat-mongodb
    links:
      - rocketchat-mongodb
    labels:
      traefik.enable: true
      traefik.http.routers.rocketchat-router.rule: Host(`chat.wechange.localhost`)
      traefik.http.routers.rocketchat-router.service: rocketchat
      traefik.http.services.rocketchat.loadbalancer.server.port: 3000

  rocketchat-mongodb:
    image: docker.io/bitnami/mongodb:5.0
    container_name: rocketchat-mongodb
    restart: always
    volumes:
      - rocketchat-mongodb-data:/bitnami/mongodb
    env_file:
      - ../settings/rocketchat.mongodb.env
